spring.application.name=DimmerTickBackEnd
# Import local configuration
spring.config.import=optional:classpath:application-local.properties
# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.hbm2ddl.halt_on_error=true
#============================== FRONT-END
spring.web.resources.static-locations=file:/mnt/hdd/Home/Programming%20Files/RealProjects/Dimmertick/Front-End/,classpath:/static/
# Sessions
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=false
#===================================== REDIS
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2s
#===================================== GEO-BLOCK
# Countries we do not serve (ISO 3166-1 alpha-2 codes, comma-separated)
dimmertick.geo.blocked=FR,PS
# Testing only: pretend every request comes from this country. Leave empty in production.
dimmertick.geo.dev-country=